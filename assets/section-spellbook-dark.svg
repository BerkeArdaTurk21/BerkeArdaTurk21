<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="Spellbook"><title>Spellbook</title><style>.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-10}}.spin{animation:spin 120s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}.drift{animation:drift 7s ease-in-out infinite}@keyframes drift{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){.flow,.spin,.tw,.drift{animation:none}}</style><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="sky" cx="0.10" cy=".3" r=".9"><stop offset="0" stop-color="#173352"/><stop offset="1" stop-color="#0a1222"/></radialGradient></defs><rect x=".5" y=".5" width="999" height="71" rx="7" fill="url(#sky)" stroke="#22314a"/><rect x="6.5" y="6.5" width="987" height="59" rx="3" fill="none" stroke="#22314a" stroke-opacity=".7"/><path d="M6.5 3.3L9.7 6.5L6.5 9.7L3.3 6.5Z" fill="#7dd3fc" fill-opacity="1"/><path d="M993.5 3.3L996.7 6.5L993.5 9.7L990.3 6.5Z" fill="#7dd3fc" fill-opacity="1"/><path d="M6.5 62.3L9.7 65.5L6.5 68.7L3.3 65.5Z" fill="#7dd3fc" fill-opacity="1"/><path d="M993.5 62.3L996.7 65.5L993.5 68.7L990.3 65.5Z" fill="#7dd3fc" fill-opacity="1"/><circle cx="446.0" cy="24.5" r="1.41" fill="#cfe9ff" fill-opacity="0.54" class="tw" style="animation-delay:0.3s"/><circle cx="746.0" cy="12.2" r="0.70" fill="#cfe9ff" fill-opacity="0.29"/><circle cx="626.2" cy="55.2" r="1.11" fill="#cfe9ff" fill-opacity="0.38"/><circle cx="839.5" cy="56.8" r="0.83" fill="#cfe9ff" fill-opacity="0.41"/><circle cx="671.0" cy="62.5" r="1.41" fill="#cfe9ff" fill-opacity="0.78"/><circle cx="712.4" cy="20.8" r="1.11" fill="#cfe9ff" fill-opacity="0.51" class="tw" style="animation-delay:1.9s"/><circle cx="487.5" cy="19.