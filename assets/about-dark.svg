<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="261" viewBox="0 0 1000 261" role="img" aria-label="I&#x27;m a Computer Science undergraduate at Vizja University, specialising in AI and Data Science. I like taking a real dataset all the way to an honest answer: a simple baseline first, validation without leakage, and a clear note on what the model cannot do. The results that hold up become apps and write-ups. Focused on machine learning on tabular data, model explainability and big data with PySpark. Writing about my data projects on Medium. Open to machine learning and data roles."><title>I&#x27;m a Computer Science undergraduate at Vizja University, specialising in AI and Data Science. I like taking a real dataset all the way to an honest answer: a simple baseline first, validation without leakage, and a clear note on what the model cannot do. The results that hold up become apps and write-ups. Focused on machine learning on tabular data, model explainability and big data with PySpark. Writing about my data projects on Medium. Open to machine learning and data roles.</title><style>.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-10}}.spin{animation:spin 120s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}.drift{animation:drift 7s ease-in-out infinite}@keyframes drift{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){.flow,.spin,.tw,.drift{animation:none}}</style><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="sky" cx="0.10" cy=".3" r=".9"><stop offset="0" stop-color="#173352"/><stop offset="1" stop-color="#0a1222"/></radialGradient></defs><rect x=".5" y=".5" width="999" height="260" rx="7" fill="url(#sky)" stroke="#22314a"/><rect x="6.5" y="6.5" wi