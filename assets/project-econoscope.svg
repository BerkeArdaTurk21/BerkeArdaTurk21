<style>.ring{animation:d 1.6s ease-out both}@keyframes d{from{stroke-dasharray:0 226.2}to{stroke-dasharray:226.2 226.2}}</style>
<rect x="1" y="1" width="438" height="188" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="22" y="24" width="10" height="10" rx="2" fill="#34D399"/>
<text x="40" y="34" font-size="18" font-weight="700" fill="#E6E9F5">EconoScope</text>
<text x="22" y="56" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#34D399" letter-spacing="1">EXPLORATORY ANALYSIS</text>
<text x="22" y="82" font-size="13" fill="#8B93B8">Global inflation across 212 countries and</text>
