<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10162E"/><stop offset="1" stop-color="#0B0F1E"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".9"/><stop offset=".5" stop-color="#26305C"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".7"/>
  </linearGradient>
