<rect x="68" y="148" width="60" height="24" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".55"/><text x="98.0" y="164.5" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E6E9F5">pandas</text>
<rect x="134" y="148" width="66" height="24" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".55"/><text x="167.0" y="164.5" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E6E9F5">seaborn</text>
<circle cx="378" cy="80" r="36" fill="none" stroke="#26305C" stroke-width="7"/>
<circle class="ring" cx="378" cy="80" r="36" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-dasharray="226.2 226.2" transform="rotate(-90 378 80)"/>
