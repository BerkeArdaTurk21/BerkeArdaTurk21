name: Refresh profile assets

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/art/**", ".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SVGs and quest table
        run: python scripts/build_profile.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 3D contribution realm (MIT, https://github.com/yoshi389111/github-profile-3d-contrib), pinned to v0.9.3.
      - name: Build 3D contribution realm
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets README.md profile-3d-contrib
          git diff --cached --quiet || (git commit -m "Refresh profile assets" && git push)
